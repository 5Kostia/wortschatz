<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#18191d"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Wortschatz">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><title>Wortschatz</title>
<style>
:root{--bg:#18191d;--s:#212329;--s2:#292b33;--ln:#32343d;--tx:#e4e4e8;--mu:#9597a2;--ac:#7d9bd1;--ok:#78b895;--bad:#d48a8a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,system-ui,"Segoe UI",sans-serif}
body{position:fixed;top:0;left:0;right:0;bottom:0;height:auto;display:flex;flex-direction:column}
html{background:#1d1f24}
#app{flex:1;min-height:0;width:100%;max-width:560px;align-self:center;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 18px) 16px 24px}
h1{font-size:26px;margin:4px 0 14px;font-weight:650}h2{font-size:19px;margin:18px 0 10px}
.card{background:var(--s);border:1px solid var(--ln);border-radius:16px;padding:16px;margin:0 0 12px}
.big{font-size:26px;font-weight:650;margin:6px 0 10px;overflow-wrap:anywhere}.mu{color:var(--mu);font-size:14px}.ok{color:var(--ok)}.bad{color:var(--bad)}
.btn{display:block;width:100%;text-align:left;background:var(--s2);color:var(--tx);border:1px solid var(--ln);border-radius:14px;padding:15px 16px;margin:0 0 10px;font:inherit;min-height:52px}
.btn:active{background:#33353f}.btn.p{background:var(--ac);color:#14161b;border-color:var(--ac);font-weight:650;text-align:center}
.btn.c{text-align:center}.row{display:flex;gap:10px}.row .btn{margin:0 0 10px}
.chip{display:inline-block;padding:9px 14px;margin:0 8px 8px 0;border-radius:20px;border:1px solid var(--ln);background:var(--s2);color:var(--tx);font:inherit}.chip.on{border-color:var(--ac);color:var(--ac)}
input[type=text],input[type=number],select{width:100%;background:var(--s2);color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:14px;font:inherit;margin:0 0 10px}
.ex{margin:6px 0 0;padding-left:14px;border-left:2px solid var(--ln)}.ex i{color:var(--mu)}
nav{flex:none;background:#1d1f24;border-top:1px solid var(--ln);display:flex;padding:4px 6px max(calc(env(safe-area-inset-bottom) - 20px),6px)}
nav button{flex:1;background:none;border:0;color:var(--mu);font:12px inherit;padding:6px 0}nav button b{display:block;font-size:20px;font-weight:400}nav button.on{color:var(--ac)}
</style></head><body><div id="app"></div>
<nav><button data-a="tab" data-v="home"><b>🏠</b>Главная</button><button data-a="tab" data-v="learn"><b>📚</b>Учить</button><button data-a="tab" data-v="review"><b>🔁</b>Повторить</button><button data-a="tab" data-v="stats"><b>📊</b>Слова</button><button data-a="tab" data-v="set"><b>⚙️</b>Ещё</button></nav>
<input type="file" id="imp" accept=".json,application/json,text/plain" hidden>
<script src="logic.js"></script><script src="app.js"></script></body></html>
